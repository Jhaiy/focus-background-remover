services:
  - type: web
    name: focus-background-remover
    runtime: node
    plan: free
    # postinstall downloads the model (see MODELS below)
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: ONNXRUNTIME_NODE_INSTALL_CUDA
        value: skip
      # Free tier has 512 MB RAM: use the small model and downscale uploads.
      - key: MODELS
        value: u2netp.onnx
      - key: MODEL_PATH
        value: src/model/u2netp.onnx
      - key: MAX_CONCURRENT_REQUESTS
        value: "1"
      - key: MAX_IMAGE_DIMENSION
        value: "1600"
      - key: MAX_FILE_SIZE_MB
        value: "25"
